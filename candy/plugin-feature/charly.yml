version: 2026.232.0520
plugin-feature:
    candy:
        version: 2026.179.0000
        description: |-
            COMPILED-IN charly COMMAND-class plugin (command:feature) serving the externalized
            `charly feature …` CLI — the plan-shaped-description inspection surface
            (list / pending / validate). The plugin OWNS the subcommand grammar, the output
            formatting (command.go: runFeatureCLI) AND the project ENUMERATION — the former
            "feature" HostBuild seam's body (charly/host_build_feature.go) is DELETED (K-wave 2
            cone R6): the loader is plugin-reachable, so enumerateFeatures loads the project
            PLUGIN-SIDE over the reverse channel via loaderkit (LoadUnifiedViaExecutor +
            ProjectCandiesScanned + FinalizeScannedCandies) and flattens every kind: entity's plan
            into plain DATA (per-entity kind/name/description/plan, spec.FeatureEntity). The Step
            plan model + validatePlanSteps (shared with `charly box validate`, R3) are spec/kit.
            The plugin does ALL the list/pending/validate formatting + the exit code. No core
            symbol crosses the boundary. (The Feature RUN verbs are NOT part of this move —
            `charly box feature run` / `charly check feature run` stay children of box/check in the
            core binary.)

            feature is COMPILED-IN (charly.yml compiled_plugins) because its Invoke(OpRun)
            (provider.go) needs the in-proc reverse channel — threaded by dispatchInProcCommand
            ("Seam A") — to reach the host loader legs for the plugin-side load; the out-of-process
            CliMain path has no reverse channel and errors. NewMeta advertises command:feature, so
            the compiled-in registry path (registerCompiledPlugin →
            resolve(ClassCommand,"feature") → dispatchInProcCommand → Invoke(OpRun)) dispatches it
            in-process, where it owns the operator's terminal stdio natively.

            The R10 witness is the disposable check-feature-local bed: `charly feature list candy`
            exits 0 and lists this project's candies — including the plugin-feature candy itself —
            proving the compiled-in command + the plugin-side loader enumeration end-to-end.
        plugin:
            source: github.com/opencharly/plugin-feature/candy/plugin-feature
            providers:
                - command:feature
        plan:
            - # ADE build-context check: a deterministic check that does NOT depend on the project context
              # (nor the loader reverse channel) the `charly feature` CLI needs at runtime. It is a trivial
              # build-context `plugin: command` (the built-in command CHECK verb) running `true` — the
              # mandatory ADE deterministic gate — mirroring the other compiled-in command candies
              # (plugin-clean / plugin-settings / plugin-doctor). The full compiled-in `charly feature`
              # end-to-end (list/pending/validate over the plugin-side loader enumeration) is exercised by
              # the plugin's Go coverage (flattenFeatures unit test) + the live R10 (check-feature-local).
              check: a trivial deterministic build-context gate (the built-in command check verb running `true`); the full compiled-in `charly feature` end-to-end is exercised by the plugin's Go coverage (flattenFeatures unit test) + the live R10 (check-feature-local)
              id: feature-module-present
              context:
                - build
              command: "true"

feature-skill:
    skill:
        name: feature
        family: feature
        owner: plugin-feature
        description: |-
            `charly feature list|pending|validate` — inspect a project's plan-shaped entity
            descriptions (Agent Driven Evaluation). Use to enumerate features and check their
            plan/description shape before running the acceptance gate.
        triggers:
            - "`charly feature` / feature list / feature pending / feature validate / ADE entity descriptions"
        content: |
            # charly feature — inspect plan-shaped entity descriptions

            `charly feature` enumerates a project's plan-shaped entity descriptions (the Agent
            Driven Evaluation surface). Served by `candy/plugin-feature` (`command:feature`,
            compiled-in).

            ## Command tree

            - `charly feature list [kind]` — every feature entity (optionally filtered by kind).
            - `charly feature pending [entity]` — entities whose plan has not yet been run/graded.
            - `charly feature validate [entity]` — validate an entity's plan/description shape
              (plan-step keywords, the ADE description contract).

            ## What a feature is

            A candy's `description:` + `plan:` is its acceptance test. Each plan item has exactly
            one intent — `run:` changes state, `check:` probes idempotently, `agent-run:` may
            mutate, `agent-check:` assesses live state read-only, `include:` composes another
            plan.

            ## The RUN verbs (separate)

            The acceptance RUN verbs — `charly box feature run` / `charly check feature run` —
            are children of `box`/`check` in the core binary, not this plugin. See
            `/charly-check:check` for the run + agent-grading flow.

            ## Cross-References

            - `/charly-check:check` — the ADE run + grading flow.
            - `/charly-internals:strict-policy` — the RDD/ADE/SDD discipline.
